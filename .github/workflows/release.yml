name: release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_target: x86_64-linux
          - os: ubuntu-24.04-arm
            artifact_target: aarch64-linux
          - os: macos-latest
            artifact_target: aarch64-macos
          - os: macos-13
            artifact_target: x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test (ReleaseSafe)
        shell: bash
        run: |
          zig build -Doptimize=ReleaseSafe --summary all
          zig build test --summary all
      - name: Package
        shell: bash
        run: |
          staging="minimux-${GITHUB_REF_NAME}-${{ matrix.artifact_target }}"
          mkdir -p "$staging"
          cp zig-out/bin/minimux "$staging/"
          cp LICENSE README.md SPEC-v2.2.md "$staging/"
          cp -R docs "$staging/docs"
          tar -czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: minimux-${{ matrix.artifact_target }}
          path: |
            minimux-*.tar.gz
            minimux-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "minimux $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md \
            dist/minimux-*.tar.gz dist/minimux-*.tar.gz.sha256
